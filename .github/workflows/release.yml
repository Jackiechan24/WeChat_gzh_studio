name: Release plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check release version
        run: |
          node --input-type=commonjs <<'JS'
          const manifest = require('./manifest.json');
          const versions = require('./versions.json');
          if (process.env.GITHUB_REF_NAME !== manifest.version ||
              versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error('Release tag, manifest.json, and versions.json must agree');
          }
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attest plugin files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag --title "WeChat Layout $GITHUB_REF_NAME" --generate-notes
